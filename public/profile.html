<!DOCTYPE html>
<html lang="en" class="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile | MediGo</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head>
<body class="min-h-screen bg-[#060b13] text-slate-100 flex items-center justify-center p-5">
  <main class="w-full max-w-lg glass-panel rounded-3xl p-6 sm:p-8 border border-slate-700/70">
    <div class="flex items-center justify-between"><a href="index.html" class="text-sky-400 text-sm font-bold">MediGo</a><button id="logout" class="text-xs text-rose-300">Sign out</button></div>
    <h1 class="mt-8 text-3xl font-extrabold text-white">Your profile</h1>
    <p class="mt-2 text-sm text-slate-400">Keep your contact and location details current for better hospital recommendations.</p>
    <form id="profile-form" class="mt-6 space-y-4">
      <label class="block text-xs text-slate-300">Full name<input id="name" class="profile-input" required></label>
      <label class="block text-xs text-slate-300">Email<input id="email" class="profile-input" disabled></label>
      <label class="block text-xs text-slate-300">Phone<input id="phone" class="profile-input" required></label>
      <label class="block text-xs text-slate-300">City<input id="city" class="profile-input"></label>
      <button class="w-full rounded-xl bg-sky-500 px-4 py-3 text-sm font-bold text-slate-950" type="submit">Save profile</button>
      <button id="use-location" class="w-full rounded-xl border border-slate-700 px-4 py-3 text-sm font-bold text-sky-300" type="button">Use my current location</button>
    </form>
    <p id="profile-message" class="mt-4 min-h-5 text-xs text-slate-400"></p>
  </main>
  <script src="js/profile.js"></script>
</body>
</html>
