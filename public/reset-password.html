<!DOCTYPE html>
<html lang="en" class="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password | MediGo</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head>
<body class="min-h-screen bg-[#060b13] text-slate-100 flex items-center justify-center p-5">
  <main class="w-full max-w-md glass-panel rounded-3xl p-6 sm:p-8 border border-slate-700/70"><a href="auth.html" class="text-sky-400 text-sm font-bold">MediGo</a><h1 class="mt-6 text-3xl font-extrabold text-white">Reset password</h1><p class="mt-2 text-sm text-slate-400">Request a one-time code sent to your registered email.</p><form id="reset-form" class="mt-6 space-y-4"><label class="block text-xs text-slate-300">Email<input id="email" class="reset-input" type="email" required></label><button id="request-otp" class="w-full rounded-xl border border-sky-500/50 px-4 py-3 text-sm font-bold text-sky-300" type="button">Send OTP</button><label class="block text-xs text-slate-300">Six-digit OTP<input id="otp" class="reset-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label class="block text-xs text-slate-300">New password<input id="password" class="reset-input" type="password" minlength="8" required></label><button class="w-full rounded-xl bg-sky-500 px-4 py-3 text-sm font-bold text-slate-950">Update password</button></form><p id="reset-message" class="mt-4 text-xs text-slate-400"></p></main>
  <script>
    const query = new URLSearchParams(location.search); const base = location.port === '5501' ? 'http://localhost:3000' : ''; const emailInput = document.getElementById('email'); const otpInput = document.getElementById('otp'); const passwordInput = document.getElementById('password'); const resetMessage = document.getElementById('reset-message'); emailInput.value = query.get('email') || '';
    document.querySelectorAll('.reset-input').forEach(input => input.className = 'mt-1 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-3 py-3 text-sm text-white outline-none focus:border-sky-400');
    document.getElementById('request-otp').onclick = async () => { const response = await fetch(`${base}/api/auth/forgot-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: emailInput.value }) }); const data = await response.json(); resetMessage.textContent = data.success ? data.message : data.error; };
    document.getElementById('reset-form').onsubmit = async event => { event.preventDefault(); const response = await fetch(`${base}/api/auth/reset-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: emailInput.value, otp: otpInput.value, password: passwordInput.value }) }); const data = await response.json(); resetMessage.textContent = data.success ? data.message : data.error; if (data.success) setTimeout(() => location.href = 'auth.html?mode=login', 1200); };
  </script>
</body>
</html>
