<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | MediGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-[#060b13] text-slate-100 flex items-center justify-center p-5">
  <main class="w-full max-w-md glass-panel rounded-3xl p-6 sm:p-8 border border-slate-700/70">
    <a href="index.html" class="text-sky-400 text-sm font-bold flex items-center gap-1.5">
      <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span> MediGo Health
    </a>
    <h1 id="auth-title" class="mt-6 text-3xl font-extrabold text-white">Create your account</h1>
    <p id="auth-subtitle" class="mt-2 text-sm text-slate-400">Register first to unlock hospital discovery, comparisons, and personalized recommendations.</p>
    <div class="mt-6 grid grid-cols-2 gap-2 rounded-xl bg-slate-950/70 p-1">
      <button id="login-tab" class="rounded-lg px-3 py-2 text-xs font-bold text-slate-400">Already registered? Sign in</button>
      <button id="signup-tab" class="rounded-lg bg-sky-500 px-3 py-2 text-xs font-bold text-slate-950">Register</button>
    </div>
    <form id="auth-form" class="mt-6 space-y-4">
      <label id="name-field" class="hidden text-xs text-slate-300">Full name<input id="name" class="auth-input" autocomplete="name"></label>
      <label class="block text-xs text-slate-300">Email<input id="email" class="auth-input" type="email" required autocomplete="email"></label>
      <label id="phone-field" class="hidden text-xs text-slate-300">Phone number<input id="phone" class="auth-input" type="tel" autocomplete="tel"></label>
      <label id="city-field" class="hidden text-xs text-slate-300">City / Region (optional)<input id="city" class="auth-input" autocomplete="address-level2" placeholder="Enter your city or region"></label>
      <label class="block text-xs text-slate-300">Password<input id="password" class="auth-input" type="password" required minlength="8" autocomplete="current-password"></label>
      <button id="auth-submit" class="w-full rounded-xl bg-sky-500 px-4 py-3 text-sm font-bold text-slate-950 hover:bg-sky-400" type="submit">Create account</button>
    </form>
    <button id="forgot-button" class="mt-4 text-xs font-semibold text-sky-400 hover:text-sky-300">Forgot password?</button>
    <p id="auth-message" class="mt-4 min-h-5 text-xs text-slate-400"></p>
  </main>
  <div id="auth-toast" class="fixed right-5 top-5 z-50 hidden max-w-sm rounded-2xl border px-5 py-4 text-sm font-semibold shadow-2xl" role="status" aria-live="polite"></div>
  <script src="js/auth.js"></script>
</body>
</html>
